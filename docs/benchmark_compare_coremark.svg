<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" role="img" aria-labelledby="t1 d1">
  <title id="t1">CoreMark/MHz - RISC-V peer comparison (illustrative)</title>
  <desc id="d1">Horizontal bars sorted low to high; LEVEL-V highlighted in green; in-order blue; out-of-order orange.</desc>
  <defs>
    <style type="text/css"><![CDATA[
      .lbl { font: 12px system-ui,Segoe UI,sans-serif; fill: #3d3d38; }
      .lbl-hi { font: 600 12px system-ui,Segoe UI,sans-serif; fill: #2d5016; }
      .cap { font: 11px system-ui,Segoe UI,sans-serif; fill: #6b6a63; }
      .title { font: 500 15px system-ui,Segoe UI,sans-serif; fill: #2c2c2a; }
      .axis { font: 10px system-ui,Segoe UI,sans-serif; fill: #888780; }
    ]]></style>
  </defs>
  <rect width="920" height="400" fill="#f9f9f7"/>
  <rect x="20" y="16" width="880" height="368" rx="12" fill="#fff" stroke="rgba(0,0,0,0.08)"/>
  <text x="40" y="44" class="title">CoreMark / MHz (illustrative literature mix)</text>
  <text x="40" y="62" class="cap">Same ordering as docs/performance.html - not apples-to-apples across rows.</text>
  <g transform="translate(40,72)">
    <rect width="10" height="10" fill="#185FA5" rx="2"/><text x="16" y="9" class="cap">In-order</text>
    <rect x="100" width="10" height="10" fill="#D85A30" rx="2"/><text x="116" y="9" class="cap">Out-of-order</text>
    <rect x="230" width="10" height="10" fill="#3B6D11" rx="2"/><text x="246" y="9" class="cap">LEVEL-V</text>
  </g>
  <!-- max scale 5.2; bar max width 560; x0=220 -->
  <g font-family="system-ui,Segoe UI,sans-serif">
    <text x="220" y="118" class="axis">0</text>
    <text x="328" y="118" class="axis">1</text>
    <text x="436" y="118" class="axis">2</text>
    <text x="544" y="118" class="axis">3</text>
    <text x="652" y="118" class="axis">4</text>
    <text x="760" y="118" class="axis">5</text>
    <line x1="220" y1="122" x2="780" y2="122" stroke="#e8e8e4" stroke-width="1"/>
  </g>
  <!-- rows: y = 132 + i*28; bar y = row-18 -->
  <g>
    <text x="40" y="132" class="lbl">SERV (RV32I)</text>
    <rect x="220" y="118" width="2.6" height="18" rx="3" fill="#185FA5" stroke="#85B7EB" stroke-width="0.5"/>
    <text x="228" y="130" class="axis">0.02</text>
  </g>
  <g>
    <text x="40" y="160" class="lbl">PicoRV32 (RV32IM)</text>
    <rect x="220" y="146" width="66.5" height="18" rx="3" fill="#185FA5" stroke="#85B7EB" stroke-width="0.5"/>
    <text x="292" y="158" class="axis">0.66</text>
  </g>
  <g>
    <text x="40" y="188" class="lbl">VexRiscv (RV32IM)</text>
    <rect x="220" y="174" width="247.7" height="18" rx="3" fill="#185FA5" stroke="#85B7EB" stroke-width="0.5"/>
    <text x="474" y="186" class="axis">2.30</text>
  </g>
  <g>
    <text x="40" y="216" class="lbl">Ibex (RV32IMC)</text>
    <rect x="220" y="202" width="254.2" height="18" rx="3" fill="#185FA5" stroke="#85B7EB" stroke-width="0.5"/>
    <text x="482" y="214" class="axis">2.36</text>
  </g>
  <g>
    <text x="40" y="244" class="lbl">Taiga / CVA5 (RV32IMA)</text>
    <rect x="220" y="230" width="272.5" height="18" rx="3" fill="#185FA5" stroke="#85B7EB" stroke-width="0.5"/>
    <text x="500" y="242" class="axis">2.53</text>
  </g>
  <g>
    <text x="40" y="272" class="lbl-hi">LEVEL-V (RV32IMC)</text>
    <rect x="220" y="258" width="282.2" height="18" rx="3" fill="#3B6D11" stroke="#97C459" stroke-width="2"/>
    <text x="510" y="270" class="axis">2.62</text>
  </g>
  <g>
    <text x="40" y="300" class="lbl">CV32E40P (RV32IMC)</text>
    <rect x="220" y="286" width="334.9" height="18" rx="3" fill="#185FA5" stroke="#85B7EB" stroke-width="0.5"/>
    <text x="562" y="298" class="axis">3.11</text>
  </g>
  <g>
    <text x="40" y="328" class="lbl">BOOMv3 (RV64GC, OoO)</text>
    <rect x="220" y="314" width="452.3" height="18" rx="3" fill="#D85A30" stroke="#F0997B" stroke-width="0.5"/>
    <text x="680" y="326" class="axis">4.20</text>
  </g>
  <g>
    <text x="40" y="356" class="lbl">NaxRiscv (RV32IMA, OoO)</text>
    <rect x="220" y="342" width="538.5" height="18" rx="3" fill="#D85A30" stroke="#F0997B" stroke-width="0.5"/>
    <text x="766" y="354" class="axis">5.00</text>
  </g>
  <text x="40" y="392" class="cap">Sources: see footer of docs/performance.html - OoO rows are upper-bound reference only.</text>
</svg>
