<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img" aria-labelledby="title desc">
  <title id="title">Level-V CoreMark performance snapshot</title>
  <desc id="desc">A normalized bar chart showing a 1.00 baseline and Level-V at 2.62 CoreMark per MHz, plus callouts for 65.38 CoreMarks at 25 MHz and 3,824,420 ticks over 10 iterations.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#08141d"/>
      <stop offset="100%" stop-color="#123142"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00a67e"/>
      <stop offset="100%" stop-color="#53d7a5"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10212c"/>
      <stop offset="100%" stop-color="#0b1821"/>
    </linearGradient>
  </defs>

  <rect width="900" height="340" rx="28" fill="url(#bg)"/>
  <rect x="26" y="24" width="848" height="292" rx="22" fill="none" stroke="#2b4350"/>

  <text x="52" y="62" fill="#eef7fb" font-size="30" font-weight="700" font-family="Segoe UI, Arial, sans-serif">Performance snapshot: CoreMark</text>
  <text x="52" y="91" fill="#9fc0cf" font-size="15" font-family="Segoe UI, Arial, sans-serif">Verilator RTL sim, 10 iterations, normalized view for quick README scanning</text>

  <line x1="220" y1="238" x2="560" y2="238" stroke="#406171" stroke-width="3"/>
  <line x1="220" y1="109" x2="220" y2="246" stroke="#29414d" stroke-width="1"/>
  <line x1="333" y1="109" x2="333" y2="246" stroke="#29414d" stroke-width="1"/>
  <line x1="447" y1="109" x2="447" y2="246" stroke="#29414d" stroke-width="1"/>
  <line x1="560" y1="109" x2="560" y2="246" stroke="#29414d" stroke-width="1"/>

  <text x="220" y="264" text-anchor="middle" fill="#94b2c0" font-size="12" font-family="Segoe UI, Arial, sans-serif">0.0</text>
  <text x="333" y="264" text-anchor="middle" fill="#94b2c0" font-size="12" font-family="Segoe UI, Arial, sans-serif">1.0</text>
  <text x="447" y="264" text-anchor="middle" fill="#94b2c0" font-size="12" font-family="Segoe UI, Arial, sans-serif">2.0</text>
  <text x="560" y="264" text-anchor="middle" fill="#94b2c0" font-size="12" font-family="Segoe UI, Arial, sans-serif">3.0</text>

  <text x="52" y="147" fill="#d7e6ee" font-size="18" font-weight="600" font-family="Segoe UI, Arial, sans-serif">1.00 baseline</text>
  <rect x="220" y="130" width="113" height="22" rx="11" fill="#6b7f8c"/>
  <text x="349" y="147" fill="#d7e6ee" font-size="15" font-family="Segoe UI, Arial, sans-serif">Reference scale</text>

  <text x="52" y="199" fill="#ffffff" font-size="20" font-weight="700" font-family="Segoe UI, Arial, sans-serif">Level-V</text>
  <rect x="220" y="182" width="297" height="24" rx="12" fill="url(#bar)"/>
  <text x="533" y="200" fill="#ffffff" font-size="16" font-weight="700" font-family="Segoe UI, Arial, sans-serif">2.62 CoreMark/MHz</text>

  <rect x="610" y="78" width="238" height="188" rx="20" fill="url(#panel)" stroke="#24404c"/>
  <text x="638" y="114" fill="#8fd7bf" font-size="15" font-weight="700" font-family="Segoe UI, Arial, sans-serif">25 MHz equivalent</text>
  <text x="638" y="156" fill="#ffffff" font-size="38" font-weight="700" font-family="Segoe UI, Arial, sans-serif">65.38</text>
  <text x="638" y="181" fill="#b7ced9" font-size="16" font-family="Segoe UI, Arial, sans-serif">CoreMarks total</text>
  <text x="638" y="218" fill="#e6f2f7" font-size="18" font-weight="600" font-family="Segoe UI, Arial, sans-serif">3,824,420 ticks</text>
  <text x="638" y="241" fill="#8eaab7" font-size="14" font-family="Segoe UI, Arial, sans-serif">10 iterations, GCC15.1.0 banner</text>

  <text x="52" y="301" fill="#8eaab7" font-size="13" font-family="Segoe UI, Arial, sans-serif">Bars use a fixed 1.00 baseline for fast scanning. Detailed methodology and reproduction commands stay in the README benchmark section.</text>
</svg>